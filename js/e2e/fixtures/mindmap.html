<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>framesheet e2e: mind map</title>
<style>
  body { margin: 0; background: #f1f5f9; font: 14px sans-serif; }
  #toggle { position: absolute; left: 16px; top: 16px; }
  #mindmap { position: absolute; left: 40px; top: 60px; width: 480px; height: 270px; background: #ffffff;
             border-radius: 12px; box-shadow: 0 1px 3px rgba(15, 23, 42, 0.2); }
  .edge { stroke: #94a3b8; stroke-width: 3; stroke-dasharray: 180; stroke-dashoffset: 180; }
  .leaf { fill: #6366f1; transform-box: fill-box; transform-origin: center; transform: scale(0); }
  .root { fill: #0f172a; }
  /* Opening: edges draw, then leaves pop in, staggered. */
  .open .edge { animation: draw 0.5s ease-out forwards; }
  .open .leaf { animation: pop 0.4s cubic-bezier(.3, 1.6, .5, 1) forwards; }
  .open .d1 { animation-delay: 0.1s; } .open .d2 { animation-delay: 0.2s; } .open .d3 { animation-delay: 0.3s; }
  .open .leaf.d0 { animation-delay: 0.4s; } .open .leaf.d1 { animation-delay: 0.5s; }
  .open .leaf.d2 { animation-delay: 0.6s; } .open .leaf.d3 { animation-delay: 0.7s; }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  @keyframes pop { to { transform: scale(1); } }
  /* ?variant=broken: a regression (leaves pop in at the wrong size). */
  .broken.open .leaf { animation-name: pop-big; }
  @keyframes pop-big { to { transform: scale(1.8); } }
  @media (prefers-reduced-motion: reduce) { .open .edge, .open .leaf { animation: none; } }
</style>
</head>
<body>
<button id="toggle">open</button>
<svg id="mindmap" viewBox="0 0 480 270" role="img" aria-label="Mind map">
  <g class="edges">
    <line class="edge d0" x1="240" y1="135" x2="90" y2="60"/>
    <line class="edge d1" x1="240" y1="135" x2="390" y2="60"/>
    <line class="edge d2" x1="240" y1="135" x2="90" y2="210"/>
    <line class="edge d3" x1="240" y1="135" x2="390" y2="210"/>
  </g>
  <circle class="root" cx="240" cy="135" r="30"/>
  <rect class="leaf d0" x="55" y="40" width="70" height="40" rx="8"/>
  <rect class="leaf d1" x="355" y="40" width="70" height="40" rx="8"/>
  <rect class="leaf d2" x="55" y="190" width="70" height="40" rx="8"/>
  <rect class="leaf d3" x="355" y="190" width="70" height="40" rx="8"/>
</svg>
<script>
  const map = document.getElementById("mindmap");
  if (location.search.includes("variant=broken")) map.classList.add("broken");
  document.getElementById("toggle").addEventListener("click", () => map.classList.toggle("open"));
</script>
</body>
</html>

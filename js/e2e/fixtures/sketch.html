<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>framesheet e2e: rAF drawing</title>
<style>body { margin: 0; background: #0f172a; } #sketch { position: absolute; left: 20px; top: 20px; }</style>
</head>
<body>
<canvas id="sketch" width="360" height="200"></canvas>
<script>
  // JS-driven (requestAnimationFrame + performance.now): a stroke that draws itself.
  const ctx = document.getElementById("sketch").getContext("2d");
  const start = performance.now();
  function frame() {
    const t = Math.min(1, (performance.now() - start) / 1500);
    ctx.fillStyle = "#0f172a";
    ctx.fillRect(0, 0, 360, 200);
    ctx.strokeStyle = "#fbbf24";
    ctx.lineWidth = 6;
    ctx.lineCap = "round";
    ctx.beginPath();
    for (let i = 0; i <= 100 * t; i++) {
      const x = 20 + i * 3.2;
      const y = 100 + Math.sin(i / 8) * 60;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
    if (t < 1) requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body>
</html>

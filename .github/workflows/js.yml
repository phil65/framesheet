name: JS (npm package)

# The npm package in js/ (TypeScript port sharing src/framesheet/runtime.js and the report
# schema with the Python package). Separate from the template-managed build.yml.

on: [push, pull_request]

env:
  FORCE_COLOR: 1

defaults:
  run:
    working-directory: js

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install dependencies (npm ci)
        run: npm ci

      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: runtime.js parity (dist embeds src/framesheet/runtime.js)
        run: npm run check:runtime

      # Fresh Python reports from this machine, so the parity test can compare strictly.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0
        with:
          enable-cache: true
          cache-dependency-glob: pyproject.toml
          python-version: "3.13"

      - name: Generate Python reports for the fixtures
        working-directory: .
        run: |
          uv sync --all-extras --no-group docs
          uv run --no-sync playwright install chromium
          uv run --no-sync python scripts/sync_schema.py --golden --out "$RUNNER_TEMP/golden"
          git diff --exit-code schema/report.schema.json schema/marks.schema.json

      - name: Unit + integration tests (vitest, strict parity with Python)
        run: npm test
        env:
          FRAMESHEET_GOLDEN_DIR: ${{ runner.temp }}/golden

      - name: Playwright e2e (expectAnimation)
        run: npm run test:e2e

      - name: Upload Playwright results
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-results-node${{ matrix.node }}
          path: js/test-results
          retention-days: 7

  runtimes:
    # The library itself supports Node >= 20 and Bun (the test tooling needs Node >= 22).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node 22 (build)
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: js/package-lock.json

      - name: Install, build, Chromium
        run: |
          npm ci
          npm run build
          npx playwright install --with-deps chromium

      - name: Set up Node 20
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Smoke test on Node 20
        run: node --version && node scripts/smoke.mjs

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Smoke test on Bun
        run: bun --version && bun scripts/smoke.mjs

      - name: Package contents
        run: npm pack --dry-run --ignore-scripts

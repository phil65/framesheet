<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 200" role="img" aria-label="Box that leaves the canvas">
  <title>Fly-out</title>
  <style>
    #box { transform-box: fill-box; animation: fly 2s ease-in-out infinite; }
    /* Bug: at 50% the box is translated far outside the 400px viewBox. */
    @keyframes fly { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(380px); } }
    @media (prefers-reduced-motion: reduce) { #box { animation: none; } }
  </style>
  <rect width="400" height="200" fill="#ecfeff"/>
  <rect id="box" x="40" y="70" width="60" height="60" rx="6" fill="#0891b2"/>
</svg>

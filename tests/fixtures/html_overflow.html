<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Badge</title>
<style>
  body { margin: 0; font: 16px sans-serif; }
  .badge { position: absolute; left: 40px; top: 40px; width: 90px; height: 24px; overflow: hidden;
           white-space: nowrap; background: #fde68a; animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { from { background: #fde68a; } to { background: #fbbf24; } }
  @media (prefers-reduced-motion: reduce) { .badge { animation: none; } }
</style></head>
<body><div class="badge">A label that is much too long for the badge</div></body></html>

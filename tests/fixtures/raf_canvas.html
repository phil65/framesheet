<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>rAF canvas</title>
<style>html, body { margin: 0; background: #111827; }</style></head>
<body>
<canvas id="c" width="640" height="360"></canvas>
<script>
  // JS-driven animation: position depends on performance.now(), redrawn every frame.
  const ctx = document.getElementById("c").getContext("2d");
  const start = performance.now();
  function frame() {
    const t = (performance.now() - start) / 1000;
    ctx.fillStyle = "#111827";
    ctx.fillRect(0, 0, 640, 360);
    const x = 320 + Math.cos(t * Math.PI) * 220;
    ctx.fillStyle = "#34d399";
    ctx.beginPath();
    ctx.arc(x, 180, 30, 0, Math.PI * 2);
    ctx.fill();
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
</script>
</body></html>

<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 160" role="img" aria-label="Card with overflowing text">
  <title>Overflowing text</title>
  <style>
    .pulse { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
    @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } }
  </style>
  <rect width="400" height="160" fill="#f8fafc"/>
  <rect id="card" x="40" y="50" width="140" height="60" rx="8" fill="#e0e7ff" stroke="#6366f1"/>
  <!-- Bug: the label is far wider than its 140px card. -->
  <text id="label" x="52" y="86" font-family="sans-serif" font-size="18" fill="#1e1b4b">Orchestrator service layer</text>
  <circle class="pulse" cx="300" cy="80" r="20" fill="#6366f1"/>
</svg>
